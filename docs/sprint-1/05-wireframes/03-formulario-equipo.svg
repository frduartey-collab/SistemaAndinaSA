<style>text{font-family:Arial,sans-serif;fill:#202832}.title{font-size:28px;font-weight:bold}.normal{font-size:18px}.small{font-size:15px}.label{font-size:17px;font-weight:bold}rect{rx:7}</style>
<rect width="1200" height="800" fill="#f4f5f7"/>

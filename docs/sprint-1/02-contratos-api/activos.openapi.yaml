openapi: 3.1.0
info:
  title: Manufacturas Andina - Gestión de activos
  version: 0.3.0
  description: RF-02 / HU-02. SUPERVISOR y JEFATURA crean/editan/dan de baja; TECNICO y TRABAJADOR
    solo consultan; BODEGA sin acceso. Código inmutable, único incluso tras baja. No implementa
    transiciones de estado de HU-04/HU-05.
security:
  - bearerAuth: []
paths:
  /activos:
    get:
      operationId: listarActivos
      summary: Consultar activos con búsqueda, filtros y paginación
      parameters:
        - name: q
          in: query
          schema: &a10
            type: string
            maxLength: 120
            description: Subcadena literal en código o nombre, sin distinguir mayúsculas ASCII.
        - name: criticidad
          in: query
          schema: &a11
            $ref: "#/components/schemas/CriticidadEquipo"
        - name: estado
          in: query
          schema: &a12
            $ref: "#/components/schemas/EstadoEquipo"
        - name: page
          in: query
          schema: &a13
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
        - name: size
          in: query
          schema: &a14
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de activos no eliminados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaActivos"
        "400": &a3
          description: Solicitud, identificador o parámetros inválidos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - DATOS_INVALIDOS
        "401": &a1
          description: Sesión ausente, inválida, expirada o revocada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - NO_AUTORIZADO
        "403": &a2
          description: El rol no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - SIN_PERMISO
      description: SUPERVISOR, JEFATURA, TECNICO y TRABAJADOR. Excluye deleted_at no nulo. total usa los
        mismos filtros que items; orden estable por id. (page-1)*size debe ser un entero seguro.
    post:
      operationId: crearActivo
      summary: Crear activo (SUPERVISOR o JEFATURA)
      description: |
        En Particular se permiten hasta 50 equipos vigentes por cliente. Una sede
        opcional requiere Empresa y debe pertenecer al mismo cliente.
      requestBody: &cuerpoCrearActivo
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoCrearSolicitud"
      responses: &respuestasCrearActivo
        "201":
          description: Activo creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivoRespuesta"
          headers:
            Location:
              schema:
                type: string
              description: Ruta del activo creado.
        "400":
          description: Cuerpo o formato EQ-0000 inválido.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - DATOS_INVALIDOS
                          - CODIGO_FORMATO_INVALIDO
        "401": *a1
        "403":
          description: SIN_PERMISO, PLAN_EMPRESA_REQUERIDO o CUPO_EQUIPOS_ALCANZADO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "404":
          description: SEDE_NO_ENCONTRADA. La sede no existe en el cliente de la sesión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "409":
          description: Código ya reservado, incluso si el activo fue dado de baja.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - CODIGO_DUPLICADO
  /equipos:
    post:
      operationId: crearEquipo
      summary: Crear equipo con los mismos permisos y cupos de POST /activos
      requestBody: *cuerpoCrearActivo
      responses: *respuestasCrearActivo

  /activos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    get:
      operationId: consultarActivo
      summary: Consultar activo no eliminado
      responses:
        "200":
          description: Activo encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivoRespuesta"
        "400": *a3
        "401": *a1
        "403": *a2
        "404": &a4
          description: Activo inexistente o dado de baja.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - ACTIVO_NO_ENCONTRADO
    patch:
      operationId: modificarActivo
      summary: Editar activo (SUPERVISOR o JEFATURA); código inmutable
      description: Asignar una sede requiere Empresa. Enviar sede_id null quita la asignación.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoActualizarSolicitud"
      responses:
        "200":
          description: Activo editado, o sin cambios si solo se envió codigo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivoRespuesta"
        "400": *a3
        "401": *a1
        "403":
          description: SIN_PERMISO o PLAN_EMPRESA_REQUERIDO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "404":
          description: ACTIVO_NO_ENCONTRADO o SEDE_NO_ENCONTRADA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
    delete:
      operationId: darDeBajaActivo
      summary: Baja lógica (SUPERVISOR o JEFATURA)
      description: Asigna deleted_at con hora del servidor y estado FUERA_DE_SERVICIO. Conserva fila,
        código único y auditoría. No borra físicamente ni habilita transiciones generales de estado.
      responses:
        "204":
          description: Baja aplicada, sin cuerpo.
        "400": *a3
        "401": *a1
        "403": *a2
        "404": *a4
  /equipos/{id}/historial:
    get:
      operationId: consultarHistorialEquipo
      summary: Consultar la trazabilidad de un equipo vigente
      description: |
        Disponible para Técnico, Supervisor y Jefatura. Devuelve un registro por
        falla con su orden e intervención, si existen. Ordena por actividad
        más reciente y, en empate, por identificador de falla descendente.
        Los eventos de orden sin fecha registrada en auditoría se devuelven
        con fecha nula.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/IdHistorial" } }
        - { name: page, in: query, schema: { $ref: "#/components/schemas/PaginaHistorial" } }
        - { name: size, in: query, schema: { $ref: "#/components/schemas/TamanoHistorial" } }
      responses:
        "200":
          description: Página de actividades registradas para el equipo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistorialEquipo" }
        "400": *a3
        "401": *a1
        "403": *a2
        "404": *a4
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    IdHistorial: { type: integer, minimum: 1, maximum: 9007199254740991 }
    PaginaHistorial: { type: integer, minimum: 1, maximum: 9007199254740991, default: 1 }
    TamanoHistorial: { type: integer, minimum: 1, maximum: 100, default: 20 }
    FechaActividad: { type: string, format: date-time }
    FechaEventoOrden:
      type: [string, "null"]
      format: date-time
    ConsultaHistorialEquipo:
      type: object
      additionalProperties: false
      required: [page, size]
      properties:
        page: { $ref: "#/components/schemas/PaginaHistorial" }
        size: { $ref: "#/components/schemas/TamanoHistorial" }
    HistorialEquipo:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/RegistroHistorialEquipo" } }
        total: { type: integer, minimum: 0 }
        page: { $ref: "#/components/schemas/PaginaHistorial" }
        size: { $ref: "#/components/schemas/TamanoHistorial" }
    RegistroHistorialEquipo:
      type: object
      additionalProperties: false
      required: [actividad_en, falla, orden, intervencion]
      properties:
        actividad_en: { $ref: "#/components/schemas/FechaActividad" }
        falla: { $ref: "#/components/schemas/FallaHistorialEquipo" }
        orden:
          oneOf:
            - { $ref: "#/components/schemas/OrdenHistorialEquipo" }
            - { type: "null" }
        intervencion:
          oneOf:
            - { $ref: "#/components/schemas/IntervencionHistorialEquipo" }
            - { type: "null" }
    FallaHistorialEquipo:
      type: object
      additionalProperties: false
      required: [id, descripcion, prioridad, fecha_reporte]
      properties:
        id: { $ref: "#/components/schemas/IdHistorial" }
        descripcion: { type: string, minLength: 1, maxLength: 2000 }
        prioridad: { $ref: "#/components/schemas/CriticidadEquipo" }
        fecha_reporte: { $ref: "#/components/schemas/FechaActividad" }
    EstadoOrden:
      type: string
      enum: [PENDIENTE, EN_PROGRESO, CERRADA]
    OrdenHistorialEquipo:
      type: object
      additionalProperties: false
      required: [id, estado, fecha_limite, creada_en, iniciada_en, cerrada_en]
      properties:
        id: { $ref: "#/components/schemas/IdHistorial" }
        estado: { $ref: "#/components/schemas/EstadoOrden" }
        fecha_limite: { type: string, format: date }
        creada_en: { $ref: "#/components/schemas/FechaEventoOrden" }
        iniciada_en: { $ref: "#/components/schemas/FechaEventoOrden" }
        cerrada_en: { $ref: "#/components/schemas/FechaEventoOrden" }
    IntervencionHistorialEquipo:
      type: object
      additionalProperties: false
      required: [diagnostico, solucion, duracion_minutos, registrada_en, repuestos_usados, repuestos_consumidos]
      properties:
        diagnostico: { type: string, minLength: 1, maxLength: 2000 }
        solucion: { type: string, minLength: 1, maxLength: 2000 }
        duracion_minutos: { $ref: "#/components/schemas/IdHistorial" }
        registrada_en: { $ref: "#/components/schemas/FechaActividad" }
        repuestos_usados: { type: [string, "null"], maxLength: 2000 }
        repuestos_consumidos:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RepuestoConsumidoRespuesta" }
    RepuestoConsumidoRespuesta:
      type: object
      additionalProperties: false
      required: [repuesto_id, codigo, nombre, cantidad]
      properties:
        repuesto_id: { $ref: "#/components/schemas/IdHistorial" }
        codigo: { type: string, minLength: 1, maxLength: 60 }
        nombre: { type: string, minLength: 1, maxLength: 150 }
        cantidad: { $ref: "#/components/schemas/IdHistorial" }
    CriticidadEquipo:
      type: string
      enum:
        - ALTA
        - MEDIA
        - BAJA
    EstadoEquipo:
      type: string
      enum:
        - OPERATIVO
        - EN_FALLA
        - EN_MANTENCIÓN
        - FUERA_DE_SERVICIO
    ErrorRespuesta:
      type: object
      additionalProperties: false
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          enum:
            - NO_AUTORIZADO
            - SIN_PERMISO
            - DATOS_INVALIDOS
            - CODIGO_FORMATO_INVALIDO
            - CODIGO_DUPLICADO
            - ACTIVO_NO_ENCONTRADO
            - CUPO_EQUIPOS_ALCANZADO
            - PLAN_EMPRESA_REQUERIDO
            - SEDE_NO_ENCONTRADA
        mensaje:
          type: string
          minLength: 1
    ActivoCrearSolicitud:
      type: object
      additionalProperties: false
      required:
        - codigo
        - nombre
        - ubicacion
        - criticidad
      properties:
        codigo: &a8
          type: string
          pattern: ^EQ-[0-9]{4}$
        nombre: &a6
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        marca: &a5
          type:
            - string
            - "null"
          maxLength: 120
        modelo: *a5
        ubicacion: *a6
        criticidad: &a7
          $ref: "#/components/schemas/CriticidadEquipo"
        sede_id: &sedeOpcional
          type: [integer, "null"]
          minimum: 1
          maximum: 9007199254740991
      description: Estado inicial OPERATIVO y uso_acumulado_horas=0, asignados por servidor. Marca y
        modelo opcionales (null por defecto).
    ActivoActualizarSolicitud:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: *a6
        marca: *a5
        modelo: *a5
        ubicacion: *a6
        criticidad: *a7
        sede_id: *sedeOpcional
        uso_acumulado_horas:
          type: number
          minimum: 0
        codigo:
          description: Cualquier valor recibido se ignora; el código original es inmutable.
      description: Solo campos presentes; omitir conserva el valor, null permite vaciar marca/modelo.
        codigo se ignora incluso si es el único campo (200 sin cambios). estado, fecha_alta y
        deleted_at no son editables. No gestiona transiciones de estado.
    ActivoRespuesta:
      type: object
      additionalProperties: false
      required:
        - id
        - codigo
        - nombre
        - marca
        - modelo
        - ubicacion
        - criticidad
        - estado
        - uso_acumulado_horas
        - fecha_alta
        - deleted_at
      properties:
        id: &a9
          type: integer
          minimum: 1
          maximum: 9007199254740991
        sede_id: *a9
        codigo: *a8
        nombre: *a6
        marca: *a5
        modelo: *a5
        ubicacion: *a6
        criticidad: *a7
        estado:
          $ref: "#/components/schemas/EstadoEquipo"
        uso_acumulado_horas:
          type: number
          minimum: 0
        fecha_alta:
          type: string
          format: date-time
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
    PaginaActivos:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivoRespuesta"
        total:
          type: integer
          minimum: 0
        page: *a9
        size:
          type: integer
          minimum: 1
          maximum: 100
    ConsultaActivos:
      type: object
      additionalProperties: false
      required:
        - page
        - size
      properties:
        q: *a10
        criticidad: *a11
        estado: *a12
        page: *a13
        size: *a14

openapi: 3.1.0
info:
  title: Manufacturas Andina - Gestión de activos
  version: 0.2.0
  description: RF-02 / HU-02. SUPERVISOR y JEFATURA crean/editan/dan de baja; TECNICO y TRABAJADOR
    solo consultan; BODEGA sin acceso. Código inmutable, único incluso tras baja. No implementa
    transiciones de estado de HU-04/HU-05.
security:
  - bearerAuth: []
paths:
  /activos:
    get:
      operationId: listarActivos
      summary: Consultar activos con búsqueda, filtros y paginación
      parameters:
        - name: q
          in: query
          schema: &a10
            type: string
            maxLength: 120
            description: Subcadena literal en código o nombre, sin distinguir mayúsculas ASCII.
        - name: criticidad
          in: query
          schema: &a11
            $ref: "#/components/schemas/CriticidadEquipo"
        - name: estado
          in: query
          schema: &a12
            $ref: "#/components/schemas/EstadoEquipo"
        - name: page
          in: query
          schema: &a13
            type: integer
            minimum: 1
            maximum: 9007199254740991
            default: 1
        - name: size
          in: query
          schema: &a14
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Página de activos no eliminados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaActivos"
        "400": &a3
          description: Solicitud, identificador o parámetros inválidos.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - DATOS_INVALIDOS
        "401": &a1
          description: Sesión ausente, inválida, expirada o revocada.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - NO_AUTORIZADO
        "403": &a2
          description: El rol no tiene acceso a esta operación.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - SIN_PERMISO
      description: SUPERVISOR, JEFATURA, TECNICO y TRABAJADOR. Excluye deleted_at no nulo. total usa los
        mismos filtros que items; orden estable por id. (page-1)*size debe ser un entero seguro.
    post:
      operationId: crearActivo
      summary: Crear activo (SUPERVISOR o JEFATURA)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoCrearSolicitud"
      responses:
        "201":
          description: Activo creado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivoRespuesta"
          headers:
            Location:
              schema:
                type: string
              description: Ruta del activo creado.
        "400":
          description: Cuerpo o formato EQ-0000 inválido.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - DATOS_INVALIDOS
                          - CODIGO_FORMATO_INVALIDO
        "401": *a1
        "403": *a2
        "409":
          description: Código ya reservado, incluso si el activo fue dado de baja.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - CODIGO_DUPLICADO
  /activos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    get:
      operationId: consultarActivo
      summary: Consultar activo no eliminado
      responses:
        "200":
          description: Activo encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivoRespuesta"
        "400": *a3
        "401": *a1
        "403": *a2
        "404": &a4
          description: Activo inexistente o dado de baja.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorRespuesta"
                  - type: object
                    properties:
                      codigo:
                        enum:
                          - ACTIVO_NO_ENCONTRADO
    patch:
      operationId: modificarActivo
      summary: Editar activo (SUPERVISOR o JEFATURA); código inmutable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivoActualizarSolicitud"
      responses:
        "200":
          description: Activo editado, o sin cambios si solo se envió codigo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivoRespuesta"
        "400": *a3
        "401": *a1
        "403": *a2
        "404": *a4
    delete:
      operationId: darDeBajaActivo
      summary: Baja lógica (SUPERVISOR o JEFATURA)
      description: Asigna deleted_at con hora del servidor y estado FUERA_DE_SERVICIO. Conserva fila,
        código único y auditoría. No borra físicamente ni habilita transiciones generales de estado.
      responses:
        "204":
          description: Baja aplicada, sin cuerpo.
        "400": *a3
        "401": *a1
        "403": *a2
        "404": *a4
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CriticidadEquipo:
      type: string
      enum:
        - ALTA
        - MEDIA
        - BAJA
    EstadoEquipo:
      type: string
      enum:
        - OPERATIVO
        - EN_FALLA
        - EN_MANTENCIÓN
        - FUERA_DE_SERVICIO
    ErrorRespuesta:
      type: object
      additionalProperties: false
      required:
        - codigo
        - mensaje
      properties:
        codigo:
          type: string
          enum:
            - NO_AUTORIZADO
            - SIN_PERMISO
            - DATOS_INVALIDOS
            - CODIGO_FORMATO_INVALIDO
            - CODIGO_DUPLICADO
            - ACTIVO_NO_ENCONTRADO
        mensaje:
          type: string
          minLength: 1
    ActivoCrearSolicitud:
      type: object
      additionalProperties: false
      required:
        - codigo
        - nombre
        - ubicacion
        - criticidad
      properties:
        codigo: &a8
          type: string
          pattern: ^EQ-[0-9]{4}$
        nombre: &a6
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        marca: &a5
          type:
            - string
            - "null"
          maxLength: 120
        modelo: *a5
        ubicacion: *a6
        criticidad: &a7
          $ref: "#/components/schemas/CriticidadEquipo"
      description: Estado inicial OPERATIVO y uso_acumulado_horas=0, asignados por servidor. Marca y
        modelo opcionales (null por defecto).
    ActivoActualizarSolicitud:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre: *a6
        marca: *a5
        modelo: *a5
        ubicacion: *a6
        criticidad: *a7
        uso_acumulado_horas:
          type: number
          minimum: 0
        codigo:
          description: Cualquier valor recibido se ignora; el código original es inmutable.
      description: Solo campos presentes; omitir conserva el valor, null permite vaciar marca/modelo.
        codigo se ignora incluso si es el único campo (200 sin cambios). estado, fecha_alta y
        deleted_at no son editables. No gestiona transiciones de estado.
    ActivoRespuesta:
      type: object
      additionalProperties: false
      required:
        - id
        - codigo
        - nombre
        - marca
        - modelo
        - ubicacion
        - criticidad
        - estado
        - uso_acumulado_horas
        - fecha_alta
        - deleted_at
      properties:
        id: &a9
          type: integer
          minimum: 1
          maximum: 9007199254740991
        codigo: *a8
        nombre: *a6
        marca: *a5
        modelo: *a5
        ubicacion: *a6
        criticidad: *a7
        estado:
          $ref: "#/components/schemas/EstadoEquipo"
        uso_acumulado_horas:
          type: number
          minimum: 0
        fecha_alta:
          type: string
          format: date-time
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
    PaginaActivos:
      type: object
      additionalProperties: false
      required:
        - items
        - total
        - page
        - size
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivoRespuesta"
        total:
          type: integer
          minimum: 0
        page: *a9
        size:
          type: integer
          minimum: 1
          maximum: 100
    ConsultaActivos:
      type: object
      additionalProperties: false
      required:
        - page
        - size
      properties:
        q: *a10
        criticidad: *a11
        estado: *a12
        page: *a13
        size: *a14

openapi: 3.1.0
info:
  title: Manufacturas Andina — Órdenes de trabajo
  version: 0.4.0
  description: |
    HU-04 y HU-05 fase 1. Supervisor y Jefatura crean y consultan todas las
    órdenes. El técnico consulta e inicia sus asignaciones y registra una
    intervención para cerrarlas. Supervisor y Jefatura también pueden iniciar
    órdenes. Trabajador y Bodega no acceden al módulo. Las órdenes preventivas
    se generan a partir de un plan y tienen falla_id nulo.
security:
  - bearerAuth: []
paths:
  /ordenes:
    post:
      operationId: crearOrden
      summary: Crear una orden desde una falla pendiente
      description: |
        Requiere Supervisor o Jefatura. Cada falla de un equipo vigente admite
        una orden. El técnico asignado debe estar activo. La fecha límite es
        una fecha civil de Chile igual o posterior al día actual.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrdenCrearSolicitud" }
      responses:
        "201":
          description: Orden creada en estado PENDIENTE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdenRespuesta" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: FALLA_NO_ENCONTRADA o ACTIVO_NO_ENCONTRADO.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "409":
          description: ORDEN_DUPLICADA o TECNICO_NO_DISPONIBLE.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
    get:
      operationId: listarOrdenes
      summary: Listar órdenes recientes según el rol
      description: El filtro de órdenes abiertas se aplica antes de la paginación y respeta las asignaciones del técnico.
      parameters:
        - { name: page, in: query, schema: { $ref: "#/components/schemas/Pagina" } }
        - { name: size, in: query, schema: { $ref: "#/components/schemas/Tamano" } }
        - name: solo_abiertas
          in: query
          description: Incluye solo órdenes pendientes y en progreso cuando se indica true.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Página de órdenes visibles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaOrdenes" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
  /ordenes/tecnicos:
    get:
      operationId: listarTecnicosParaOrden
      summary: Buscar técnicos activos para una asignación
      description: Requiere Supervisor o Jefatura. Expone solo ID y nombre.
      parameters:
        - { name: q, in: query, schema: { $ref: "#/components/schemas/Busqueda" } }
        - { name: page, in: query, schema: { $ref: "#/components/schemas/Pagina" } }
        - { name: size, in: query, schema: { $ref: "#/components/schemas/Tamano" } }
      responses:
        "200":
          description: Página de técnicos activos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaTecnicos" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
  /ordenes/{id}/estado:
    patch:
      operationId: cambiarEstadoOrden
      summary: Iniciar una orden
      description: |
        Permite PENDIENTE → EN_PROGRESO. Repetir EN_PROGRESO devuelve la orden
        sin otro cambio. Solo el técnico asignado, Supervisor o Jefatura puede
        iniciar. El cierre requiere registrar una intervención.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrdenEstadoSolicitud" }
      responses:
        "200":
          description: Orden con el estado actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdenRespuesta" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: ORDEN_NO_ENCONTRADA. La orden no existe o no está asignada al técnico.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "409":
          description: TRANSICION_ORDEN_INVALIDA. La orden no puede iniciarse con el estado solicitado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
  /ordenes/{id}:
    get:
      operationId: detalleOrden
      summary: Consultar el detalle de una orden y su intervención
      description: |
        Disponible para Supervisor, Jefatura y el técnico asignado. La
        intervención es null para órdenes abiertas y cierres históricos que
        preceden al registro de intervenciones. Incluye las fotos de la falla asociada.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Detalle de la orden visible.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdenDetalleRespuesta" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404": { $ref: "#/components/responses/OrdenNoEncontrada" }
  /ordenes/{id}/fotos/{fotoId}:
    get:
      operationId: descargarFotoOrden
      summary: Consultar una foto de la falla asociada a la orden
      description: Disponible para Supervisor, Jefatura y el técnico asignado dentro del alcance de la orden.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: fotoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Contenido binario de la foto adjunta.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: ORDEN_NO_ENCONTRADA o FOTO_NO_ENCONTRADA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
  /ordenes/{id}/cierre:
    put:
      operationId: registrarIntervencionYCerrarOrden
      summary: Registrar una intervención y cerrar la orden en un solo paso
      description: |
        Solo el técnico asignado puede cerrar una orden EN_PROGRESO. El
        registro, el cambio a CERRADA y el consumo de inventario son atómicos.
        El diagnóstico es obligatorio para nuevos cierres en Empresa. En Particular
        el campo se omite de la solicitud y se guarda como null.
        Repetir la misma solicitud, con espacios recortados y los mismos
        consumos en cualquier orden, devuelve el cierre existente. Las
        intervenciones con texto previo conservan ese texto y devuelven una
        lista vacía de consumos si no se vinculó inventario.
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrdenCierreSolicitud" }
      responses:
        "200":
          description: Orden cerrada y detalle de la intervención registrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrdenDetalleRespuesta" }
        "400":
          description: DATOS_INVALIDOS o STOCK_INSUFICIENTE. Si falta stock, el mensaje identifica el repuesto y las unidades disponibles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403":
          description: SIN_PERMISO o PLAN_EMPRESA_REQUERIDO cuando Particular envía un diagnóstico en un nuevo cierre.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "404":
          description: ORDEN_NO_ENCONTRADA o REPUESTO_NO_ENCONTRADO. La orden no es visible para el técnico o uno de los repuestos no está vigente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
        "409":
          description: TRANSICION_ORDEN_INVALIDA u ORDEN_YA_CERRADA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    DatosInvalidos:
      description: DATOS_INVALIDOS. Entrada o fecha límite inválida.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
    NoAutorizado:
      description: NO_AUTORIZADO. Se requiere una sesión válida.
      headers:
        WWW-Authenticate:
          schema: { type: string, const: Bearer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
    SinPermiso:
      description: SIN_PERMISO. El rol no puede realizar esta operación.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
    OrdenNoEncontrada:
      description: ORDEN_NO_ENCONTRADA. La orden no existe o no está asignada al técnico.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorRespuesta" }
  schemas:
    Id: { type: integer, minimum: 1, maximum: 9007199254740991 }
    Pagina: { type: integer, minimum: 1, maximum: 9007199254740991, default: 1 }
    Tamano: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Busqueda: { type: string, maxLength: 120 }
    EstadoOrden:
      type: string
      enum: [PENDIENTE, EN_PROGRESO, CERRADA]
    ConsultaOrdenes:
      type: object
      additionalProperties: false
      required: [page, size]
      properties:
        page: { $ref: "#/components/schemas/Pagina" }
        size: { $ref: "#/components/schemas/Tamano" }
        solo_abiertas: { type: boolean }
    ConsultaTecnicos:
      type: object
      additionalProperties: false
      required: [page, size]
      properties:
        page: { $ref: "#/components/schemas/Pagina" }
        size: { $ref: "#/components/schemas/Tamano" }
        q: { $ref: "#/components/schemas/Busqueda" }
    OrdenCrearSolicitud:
      type: object
      additionalProperties: false
      required: [falla_id, tecnico_id, fecha_limite]
      properties:
        falla_id: { $ref: "#/components/schemas/Id" }
        tecnico_id: { $ref: "#/components/schemas/Id" }
        fecha_limite: { type: string, format: date }
    OrdenEstadoSolicitud:
      type: object
      additionalProperties: false
      required: [estado]
      properties:
        estado: { const: EN_PROGRESO }
    TextoIntervencion:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: '\S'
      not: { pattern: '\u0000' }
    TextoRepuestos:
      type: string
      maxLength: 2000
      not: { pattern: '\u0000' }
    DuracionMinutos:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    RepuestoConsumoSolicitud:
      type: object
      additionalProperties: false
      required: [repuesto_id, cantidad]
      properties:
        repuesto_id: { $ref: "#/components/schemas/Id" }
        cantidad: { $ref: "#/components/schemas/Id" }
    RepuestoConsumidoRespuesta:
      type: object
      additionalProperties: false
      required: [repuesto_id, codigo, nombre, cantidad]
      properties:
        repuesto_id: { $ref: "#/components/schemas/Id" }
        codigo: { type: string, minLength: 1, maxLength: 60 }
        nombre: { type: string, minLength: 1, maxLength: 150 }
        cantidad: { $ref: "#/components/schemas/Id" }
    OrdenCierreSolicitud:
      type: object
      additionalProperties: false
      required: [solucion, duracion_minutos]
      properties:
        diagnostico: { $ref: "#/components/schemas/TextoIntervencion" }
        solucion: { $ref: "#/components/schemas/TextoIntervencion" }
        duracion_minutos: { $ref: "#/components/schemas/DuracionMinutos" }
        repuestos_usados: { $ref: "#/components/schemas/TextoRepuestos" }
        repuestos_consumidos:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { $ref: "#/components/schemas/RepuestoConsumoSolicitud" }
          description: Un registro por repuesto_id. Si se omite, se interpreta como una lista vacía.
    IntervencionRespuesta:
      type: object
      additionalProperties: false
      required: [orden_id, autor_id, diagnostico, solucion, duracion_minutos, repuestos_usados, repuestos_consumidos, registrada_en]
      properties:
        orden_id: { $ref: "#/components/schemas/Id" }
        autor_id: { $ref: "#/components/schemas/Id" }
        diagnostico:
          oneOf:
            - { $ref: "#/components/schemas/TextoIntervencion" }
            - { type: "null" }
        solucion: { $ref: "#/components/schemas/TextoIntervencion" }
        duracion_minutos: { $ref: "#/components/schemas/DuracionMinutos" }
        repuestos_usados:
          oneOf:
            - { $ref: "#/components/schemas/TextoRepuestos" }
            - { type: "null" }
        repuestos_consumidos:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/RepuestoConsumidoRespuesta" }
          description: Fotografía del código y nombre al consumir. Ordenada por repuesto_id.
        registrada_en: { type: string, format: date-time }
    DatosOrden:
      type: object
      required: [id, falla_id, tecnico_id, tecnico_nombre, equipo_codigo, equipo_nombre, descripcion, prioridad, fecha_limite, estado]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        falla_id:
          oneOf:
            - { $ref: "#/components/schemas/Id" }
            - { type: "null" }
        plan_preventivo_id: { $ref: "#/components/schemas/Id" }
        tecnico_id: { $ref: "#/components/schemas/Id" }
        tecnico_nombre: { type: string }
        equipo_codigo: { type: string, pattern: '^EQ-[0-9]{4}$' }
        equipo_nombre: { type: string }
        descripcion: { type: string }
        prioridad: { type: string, enum: [ALTA, MEDIA, BAJA] }
        fecha_limite: { type: string, format: date }
        estado: { $ref: "#/components/schemas/EstadoOrden" }
    OrdenRespuesta:
      allOf:
        - { $ref: "#/components/schemas/DatosOrden" }
      unevaluatedProperties: false
    TipoFotoFalla:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    NombreFotoFalla:
      type: string
      minLength: 1
      maxLength: 180
      pattern: '\S'
      not: { pattern: '[\u0000-\u001f\u007f/\\]' }
    FotoFallaResumen:
      type: object
      additionalProperties: false
      required: [id, nombre, tipo]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        nombre: { $ref: "#/components/schemas/NombreFotoFalla" }
        tipo: { $ref: "#/components/schemas/TipoFotoFalla" }
    OrdenDetalleRespuesta:
      allOf:
        - { $ref: "#/components/schemas/DatosOrden" }
        - type: object
          required: [intervencion, fotos]
          properties:
            fotos:
              type: array
              maxItems: 3
              items: { $ref: "#/components/schemas/FotoFallaResumen" }
            intervencion:
              oneOf:
                - { $ref: "#/components/schemas/IntervencionRespuesta" }
                - { type: "null" }
      unevaluatedProperties: false
    TecnicoResumen:
      type: object
      additionalProperties: false
      required: [id, nombre]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        nombre: { type: string }
    PaginaOrdenes:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/OrdenRespuesta" } }
        total: { type: integer, minimum: 0 }
        page: { $ref: "#/components/schemas/Pagina" }
        size: { $ref: "#/components/schemas/Tamano" }
    PaginaTecnicos:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/TecnicoResumen" } }
        total: { type: integer, minimum: 0 }
        page: { $ref: "#/components/schemas/Pagina" }
        size: { $ref: "#/components/schemas/Tamano" }
    ErrorRespuesta:
      type: object
      additionalProperties: false
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          enum: [DATOS_INVALIDOS, NO_AUTORIZADO, SIN_PERMISO, FALLA_NO_ENCONTRADA, ACTIVO_NO_ENCONTRADO, ORDEN_DUPLICADA, TECNICO_NO_DISPONIBLE, ORDEN_NO_ENCONTRADA, TRANSICION_ORDEN_INVALIDA, ORDEN_YA_CERRADA]
        mensaje: { type: string, minLength: 1 }

openapi: 3.1.0
info:
  title: Manufacturas Andina — Reporte de fallas
  version: 0.2.0
  description: |
    HU-03. SUPERVISOR, JEFATURA, TECNICO y TRABAJADOR pueden reportar en equipos
    vigentes. Supervisor y Jefatura consultan todos los reportes. Técnico y
    Trabajador consultan los propios. BODEGA no accede. La evidencia fotográfica
    y los avisos a la supervisión se guardan junto al reporte.
security:
  - bearerAuth: []
servers:
  - url: /api
paths:
  /fallas:
    post:
      operationId: reportarFalla
      summary: Registrar una falla
      description: |
        El servidor asigna el usuario de la sesión, fecha y estado REPORTADA.
        Si no se envía prioridad, se usa la criticidad actual del equipo.
        Acepta hasta tres fotos de 5 MiB cada una. El cuerpo JSON admite hasta
        21 MiB. La falla, sus fotos y un aviso para cada Supervisor y Jefatura
        activos se guardan en una sola transacción.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FallaCrearSolicitud"
      responses:
        "201":
          description: Falla registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FallaRespuesta"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/SinPermiso"
        "404":
          description: ACTIVO_NO_ENCONTRADO. Equipo inexistente o dado de baja.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorRespuesta"
    get:
      operationId: listarFallas
      summary: Consultar reportes de falla según el rol
      parameters:
        - in: query
          name: page
          schema:
            $ref: "#/components/schemas/Pagina"
        - in: query
          name: size
          schema:
            $ref: "#/components/schemas/Tamano"
        - in: query
          name: sin_orden
          description: Con true, filtra fallas sin orden y con equipo vigente. Solo Supervisor o Jefatura.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Resultados en orden del más reciente al más antiguo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaFallas"
        "400":
          $ref: "#/components/responses/DatosInvalidos"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "403":
          $ref: "#/components/responses/SinPermiso"
  /fallas/{id}:
    get:
      operationId: obtenerFalla
      summary: Obtener una falla visible y los metadatos de sus fotos
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Detalle y lista de fotografías, vacía cuando no hay adjuntos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FallaDetalleRespuesta" }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: FALLA_NO_ENCONTRADA. La falla no existe o no es visible para el usuario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
  /fallas/{id}/fotos/{fotoId}:
    get:
      operationId: obtenerFotoFalla
      summary: Obtener los bytes de una foto de una falla visible
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
        - { name: fotoId, in: path, required: true, schema: { $ref: "#/components/schemas/Id" } }
      responses:
        "200":
          description: Imagen con el tipo MIME validado durante la subida.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/DatosInvalidos" }
        "401": { $ref: "#/components/responses/NoAutorizado" }
        "403": { $ref: "#/components/responses/SinPermiso" }
        "404":
          description: FOTO_NO_ENCONTRADA. La foto no pertenece a la falla indicada o no es visible para el usuario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorRespuesta" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    DatosInvalidos:
      description: DATOS_INVALIDOS. Cuerpo o parámetros fuera del contrato.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRespuesta"
    NoAutorizado:
      description: NO_AUTORIZADO. Se requiere una sesión válida.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRespuesta"
    SinPermiso:
      description: SIN_PERMISO. El rol no puede acceder a Fallas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorRespuesta"
  schemas:
    Id:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    Pagina:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      default: 1
    Tamano:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
    CriticidadEquipo:
      type: string
      enum: [ALTA, MEDIA, BAJA]
    EstadoFalla:
      type: string
      const: REPORTADA
    ConsultaFallas:
      type: object
      additionalProperties: false
      required: [page, size]
      properties:
        page:
          $ref: "#/components/schemas/Pagina"
        size:
          $ref: "#/components/schemas/Tamano"
        sin_orden:
          type: boolean
    FallaCrearSolicitud:
      type: object
      additionalProperties: false
      required: [equipo_id, descripcion]
      properties:
        equipo_id:
          $ref: "#/components/schemas/Id"
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          not:
            pattern: '\u0000'
        prioridad:
          $ref: "#/components/schemas/CriticidadEquipo"
        fotos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/FotoFallaSolicitud" }
    TipoFotoFalla:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    NombreFotoFalla:
      type: string
      minLength: 1
      maxLength: 180
      pattern: '\S'
      not: { pattern: '[\u0000-\u001f\u007f/\\]' }
    FotoFallaSolicitud:
      type: object
      additionalProperties: false
      required: [nombre, tipo, contenido_base64]
      properties:
        nombre: { $ref: "#/components/schemas/NombreFotoFalla" }
        tipo: { $ref: "#/components/schemas/TipoFotoFalla" }
        contenido_base64:
          type: string
          minLength: 4
          maxLength: 6990508
          contentEncoding: base64
          description: Base64 canónico con relleno. Los bytes decodificados deben coincidir con la firma MIME y ocupar como máximo 5242880 bytes.
    FotoFallaResumen:
      type: object
      additionalProperties: false
      required: [id, nombre, tipo]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        nombre: { $ref: "#/components/schemas/NombreFotoFalla" }
        tipo: { $ref: "#/components/schemas/TipoFotoFalla" }
    DatosFalla:
      type: object
      required: [id, equipo_id, equipo_codigo, equipo_nombre, usuario_id, usuario_nombre, descripcion, prioridad, estado, fecha_reporte]
      properties:
        id:
          $ref: "#/components/schemas/Id"
        equipo_id:
          $ref: "#/components/schemas/Id"
        equipo_codigo:
          type: string
          pattern: ^EQ-[0-9]{4}$
        equipo_nombre:
          type: string
        usuario_id:
          $ref: "#/components/schemas/Id"
        usuario_nombre:
          type: string
        descripcion:
          type: string
          minLength: 1
          maxLength: 2000
          pattern: '\S'
          not:
            pattern: '\u0000'
        prioridad:
          $ref: "#/components/schemas/CriticidadEquipo"
        estado:
          $ref: "#/components/schemas/EstadoFalla"
        fecha_reporte:
          type: string
          format: date-time
    FallaRespuesta:
      allOf:
        - { $ref: "#/components/schemas/DatosFalla" }
      unevaluatedProperties: false
    FallaDetalleRespuesta:
      allOf:
        - { $ref: "#/components/schemas/DatosFalla" }
        - type: object
          required: [fotos]
          properties:
            fotos:
              type: array
              maxItems: 3
              items: { $ref: "#/components/schemas/FotoFallaResumen" }
      unevaluatedProperties: false
    PaginaFallas:
      type: object
      additionalProperties: false
      required: [items, total, page, size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FallaRespuesta"
        total:
          type: integer
          minimum: 0
        page:
          $ref: "#/components/schemas/Pagina"
        size:
          $ref: "#/components/schemas/Tamano"
    ErrorRespuesta:
      type: object
      additionalProperties: false
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          enum: [DATOS_INVALIDOS, NO_AUTORIZADO, SIN_PERMISO, ACTIVO_NO_ENCONTRADO, FALLA_NO_ENCONTRADA, FOTO_NO_ENCONTRADA]
        mensaje:
          type: string
          minLength: 1

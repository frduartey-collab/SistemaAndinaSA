name: Sprint 1
on: [push, pull_request, workflow_dispatch]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run validate:contracts
      - run: npm run build
      - run: npm test
